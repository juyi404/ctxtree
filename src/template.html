<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="__ICON__">
<style>
:root {
  --paper: #EEF1F0;
  --paper-2: #F5F7F6;
  --card: #FFFFFF;
  --ink: #17202B;
  --ink-2: #4E5B68;
  --ink-3: #8A96A2;
  --rule: #DCE2E0;
  --rule-2: #C4CDCA;
  --agent: #8F9AA6;
  --hit: #F2B705;
  --bad: #C23B22;
  --bad-bg: #FCEDEA;
  --ok: #0F7B6C;
  --ok-bg: #E2F2EE;
  --link: #1B6FB0;
  --float: 0 1px 2px rgba(23, 32, 43, .05), 0 8px 24px -10px rgba(23, 32, 43, .2);
  --pop: 0 2px 6px rgba(23, 32, 43, .06), 0 20px 48px -14px rgba(23, 32, 43, .3);
  --sign: "Bahnschrift", "DIN Alternate", "Barlow", "Roboto Condensed", "Segoe UI", sans-serif;
  --body: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Microsoft YaHei UI", monospace;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #C3CCC9 transparent; }
html, body { margin: 0; height: 100%; color: var(--ink); font: 14px/1.5 var(--body); overflow: hidden; }
/* 背景只画一次：画布是单独的合成层，平移时不会重绘它 */
body { background: radial-gradient(1400px 700px at 72% -20%, #F7F9F8, rgba(247, 249, 248, 0) 70%), var(--paper); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
::selection { background: #FFE38A; color: var(--ink); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
kbd { display: inline-block; min-width: 20px; padding: 3px 5px; font: 600 11px/1 var(--sign); text-align: center; color: var(--ink-2); background: var(--card); border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 5px; }

/* 顶栏 */
.top { position: fixed; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 16px; background: var(--card); border-bottom: 1px solid var(--rule); z-index: 20; }
.brand { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); display: grid; place-items: center; }
.brand svg { width: 20px; height: 20px; display: block; }
.top h1 { margin: 0; display: flex; align-items: center; gap: 9px; min-width: 0; font: 600 19px/1 var(--sign); letter-spacing: .01em; white-space: nowrap; }
.top h1 small { font: 500 11.5px/1 var(--body); color: var(--ink-3); letter-spacing: .06em; padding: 4px 7px; border: 1px solid var(--rule); border-radius: 6px; }
.stats { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.stats > span { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; }
.stats b { font: 600 14px/1 var(--sign); color: var(--ink); }
.stats .range { background: none; border-color: transparent; color: var(--ink-3); padding: 0 2px; }
.stats .safe { color: var(--ok); background: var(--ok-bg); border-color: #C3E4DB; }
.stats .safe b { color: var(--ok); }
.stats .safe svg.i { width: 13px; height: 13px; }
.spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; height: 36px; width: min(320px, 26vw); padding: 0 8px 0 11px; color: var(--ink-3); background: var(--paper-2); border: 1px solid var(--rule); border-radius: 10px; cursor: text; }
.search:focus-within { background: var(--card); border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(23, 32, 43, .08); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.search .count { font: 12px var(--sign); color: var(--ink-2); white-space: nowrap; }
.search .count:empty { display: none; }
.search:focus-within kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px; border: 1px solid var(--rule); background: var(--card); border-radius: 10px; white-space: nowrap; color: var(--ink-2); font-weight: 500; }
.tbtn:hover { border-color: var(--rule-2); color: var(--ink); }
/* 开关组：圆点实心表示打开 */
.group { display: flex; gap: 2px; padding: 3px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 11px; }
.group .tbtn { height: 28px; padding: 0 10px 0 9px; border: 0; background: none; border-radius: 8px; font-size: 13px; }
.group .tbtn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.group .tbtn:hover { background: rgba(23, 32, 43, .05); }
.group .tbtn[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(23, 32, 43, .1), 0 0 0 1px rgba(23, 32, 43, .06); }
.group .tbtn[aria-pressed="true"]::before { background: #2A9D5C; box-shadow: none; }
.tbtn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.tbtn.primary:hover { background: #2A3644; color: #fff; }
.menu { position: relative; }
.menu.open .tbtn svg { transform: rotate(180deg); }
.menu-list { position: absolute; right: 0; top: 44px; min-width: 268px; padding: 6px; display: none; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--pop); }
.menu.open .menu-list { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; font-weight: 500; }
.menu-list button:hover { background: var(--paper-2); }
.menu-list button span { display: block; margin-top: 1px; font-size: 12px; font-weight: 400; color: var(--ink-3); }

/* 画布 */
#vp { position: fixed; inset: 56px 0 0 0; overflow: hidden; cursor: grab; touch-action: none; }
#vp.dragging { cursor: grabbing; }
/* 尺寸由脚本按布局写死，所以可以隔离尺寸和布局：挂卸卡片时只重排改动的那几个，不牵连整个画布。不加 paint 隔离，线路牌可能伸出右边界 */
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; contain: size layout style; user-select: none; -webkit-user-select: none; }
#world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

.terminus { position: absolute; width: 214px; padding: 13px 16px 15px; background: var(--ink); color: #fff; border-radius: 14px; box-shadow: 0 10px 24px -12px rgba(23, 32, 43, .5); }
.terminus::before { content: "项目起点"; display: block; margin-bottom: 8px; font: 600 10.5px/1 var(--body); letter-spacing: .16em; color: rgba(255, 255, 255, .5); }
.terminus .name { font: 600 26px/1.1 var(--sign); overflow-wrap: anywhere; }
.terminus .name.long { font-size: 19px; }
.terminus .path { margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(255, 255, 255, .12); font: 11px/1.45 var(--mono); color: rgba(255, 255, 255, .6); word-break: break-all; }

.badge { position: absolute; display: flex; align-items: center; gap: 8px; height: 24px; white-space: nowrap; pointer-events: auto; cursor: pointer; }
.badge .no { font: 600 12.5px/24px var(--sign); color: #fff; background: var(--c); min-width: 36px; padding: 0 8px; text-align: center; border-radius: 7px; letter-spacing: .02em; }
.badge.agent .no { background: var(--card); color: var(--ink-2); border: 1.5px dashed var(--agent); line-height: 21px; }
.badge .t { font-weight: 600; font-size: 13px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
.badge .d { font: 12px var(--sign); color: var(--ink-3); }
.badge:hover .t { text-decoration: underline; text-underline-offset: 3px; }

/* 卡片：顶上的色条用内阴影画，不占布局；阴影只留一层小模糊，几百张一起栅格化也不贵 */
.card { position: absolute; width: 280px; height: 150px; padding: 11px 13px 9px; background: var(--card); border: 1px solid #DDE3E1; border-radius: 10px; box-shadow: inset 0 3px 0 var(--c), 0 1px 2px rgba(23, 32, 43, .07); cursor: pointer; display: flex; flex-direction: column; gap: 5px; overflow: hidden; contain: strict; }
.card.enter { animation: card-in .22s ease-out; }
/* 缩得很小时卡片只画外框和骨架条：这时文字本来就看不清，省掉的文字排版是平移掉帧的大头 */
.card.shell > * { display: none; }
.card.shell { background: linear-gradient(#EAEEED 0 0) 13px 15px / 22% 13px no-repeat, linear-gradient(#EAEEED 0 0) 13px 42px / 88% 12px no-repeat, linear-gradient(#EAEEED 0 0) 13px 60px / 64% 12px no-repeat, linear-gradient(#F1F4F3 0 0) 13px 86px / 82% 10px no-repeat, linear-gradient(#F1F4F3 0 0) 13px 103px / 58% 10px no-repeat, linear-gradient(#F1F4F3 0 0) 13px 126px / 30% 12px no-repeat, var(--card); }
@keyframes card-in { from { opacity: 0; transform: translateY(-8px); } }
/* 子代理：色条换成虚线 */
.card.agent { box-shadow: 0 1px 2px rgba(23, 32, 43, .07); }
.card.agent::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: repeating-linear-gradient(90deg, var(--c) 0 8px, transparent 8px 14px); opacity: .65; }
#vp.dragging .card, #vp.dragging .badge { cursor: grabbing; }
.card:hover { border-color: var(--rule-2); }
.card.sel { outline: 2.5px solid var(--c); outline-offset: 2px; }
.card.hit { box-shadow: inset 0 3px 0 var(--c), 0 0 0 3px var(--hit); }
.card.agent.hit { box-shadow: 0 0 0 3px var(--hit); }
.card.dim { opacity: .28; }
.card .meta { flex: none; display: flex; align-items: center; gap: 8px; height: 18px; font: 12px/1 var(--sign); color: var(--ink-3); }
.card .idx { min-width: 24px; padding: 0 6px; font: 600 12.5px/18px var(--sign); text-align: center; border-radius: 5px; color: color-mix(in srgb, var(--c) 80%, #000); background: color-mix(in srgb, var(--c) 13%, #fff); }
.card.agent .idx { color: var(--ink-2); background: var(--paper-2); }
.card .ctx { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.card .ctx i { display: block; width: 38px; height: 5px; background: #E8ECEB; border-radius: 3px; overflow: hidden; }
.card .ctx i::before { content: ""; display: block; height: 100%; width: var(--p); background: #6B7884; border-radius: 3px; }
.card .ctx.hot { color: var(--bad); }
.card .ctx.hot i::before { background: #D64532; }
.card .q { flex: none; font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
/* 卡片高度固定：提问占两行时回复只露两行，提问一行就露三行（.q1 由脚本估算） */
.card .a { flex: 1; min-height: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.card.q1 .a { -webkit-line-clamp: 3; }
.card .a:empty::before { content: "（本轮没有文字回复）"; color: var(--ink-3); }
.card .foot { flex: none; display: flex; gap: 5px; height: 18px; font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.card .foot > * { flex: none; height: 18px; line-height: 18px; padding: 0 7px; border-radius: 5px; background: var(--paper-2); }
.card .foot .warn { color: var(--bad); background: var(--bad-bg); }
.card .agt { border: 1px dashed var(--agent); background: var(--card); line-height: 16px; font-size: 11px; color: var(--ink-2); }
.card .agt:hover, .card .agt[aria-expanded="true"] { border-color: var(--ink-2); border-style: solid; color: var(--ink); }
.card .rd { padding: 0 5px; font-size: 11px; line-height: 16px; vertical-align: 0; }

/* 线路面板、缩略图、缩放：浮在画布上的面板统一圆角加浅阴影 */
.lines { position: fixed; left: 12px; top: 68px; width: 272px; max-height: calc(100vh - 252px); overflow: auto; padding: 0 6px 6px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--float); z-index: 10; }
.lines .lh { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 8px; background: var(--card); font: 600 12px/1 var(--body); letter-spacing: .1em; color: var(--ink-3); }
.lines .lh b { padding: 3px 7px; border-radius: 6px; background: var(--paper-2); font: 600 12px/1 var(--sign); letter-spacing: 0; color: var(--ink-2); }
/* 几百条线路时，滚出面板的行不排版；占位高度是内容区的（行高 54 减上下内边距），写错了滚动条会变长 */
.lines .row { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; width: 100%; padding: 8px; border: 0; border-radius: 9px; background: none; text-align: left; cursor: pointer; content-visibility: auto; contain-intrinsic-size: auto 38px; }
.lines .row:hover { background: var(--paper-2); }
.lines .no { grid-row: span 2; min-width: 34px; padding: 0 6px; font: 600 12px/22px var(--sign); text-align: center; color: #fff; background: var(--c); border-radius: 6px; }
.lines .t { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lines .d { font: 11.5px var(--sign); color: var(--ink-3); }

#mini { position: fixed; left: 12px; bottom: 12px; width: 272px; height: 150px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--float); z-index: 10; cursor: crosshair; }
.zoom { position: fixed; right: 16px; bottom: 42px; display: flex; flex-direction: column; gap: 2px; padding: 4px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--float); z-index: 5; }
.zoom button { display: grid; place-items: center; width: 32px; height: 32px; border: 0; background: none; border-radius: 8px; color: var(--ink-2); }
.zoom button:hover { background: var(--paper-2); color: var(--ink); }
.zoom hr { width: 20px; margin: 2px auto; border: 0; border-top: 1px solid var(--rule); }
.hint { position: fixed; right: 16px; bottom: 12px; display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); white-space: nowrap; z-index: 5; pointer-events: none; }
.hint kbd { padding: 2px 5px; min-width: 18px; font-size: 10.5px; color: var(--ink-3); border-color: var(--rule); }
.hint i { width: 3px; height: 3px; margin: 0 5px; border-radius: 50%; background: var(--rule-2); }

/* 详情抽屉 */
.drawer { position: fixed; top: 56px; right: 0; bottom: 0; width: min(640px, 100vw); display: flex; flex-direction: column; background: var(--card); border-left: 1px solid var(--rule); box-shadow: -20px 0 44px -28px rgba(23, 32, 43, .4); z-index: 15; transform: translateX(100%); visibility: hidden; transition: transform .2s cubic-bezier(.2, .8, .2, 1), visibility 0s .2s; }
.drawer.open { transform: none; visibility: visible; transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.dh { padding: 16px 20px 14px; border-bottom: 1px solid var(--rule); background: linear-gradient(color-mix(in srgb, var(--c) 7%, #fff), #fff); box-shadow: inset 0 4px 0 var(--c); }
.dh .l1 { display: flex; align-items: center; gap: 8px; }
.dh .l1 .no { min-width: 38px; padding: 0 8px; font: 600 13px/26px var(--sign); text-align: center; color: #fff; background: var(--c); border-radius: 7px; }
.dh .l1 .no.agent { color: var(--ink-2); background: var(--card); border: 1.5px dashed var(--agent); line-height: 23px; }
.dh .l1 .lt { flex: 1; margin-left: 2px; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dh .l1 button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 30px; min-width: 30px; padding: 0 8px; border: 1px solid var(--rule); background: var(--card); border-radius: 8px; color: var(--ink-2); font-size: 13px; }
.dh .l1 button:not(:disabled):hover { border-color: var(--rule-2); color: var(--ink); }
.dh .l1 button:disabled { opacity: .35; cursor: default; }
.dh .l2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.dh .st { display: flex; flex-direction: column; gap: 4px; min-width: 74px; padding: 7px 11px 8px; background: rgba(255, 255, 255, .85); border: 1px solid var(--rule); border-radius: 9px; }
.dh .st { max-width: 100%; }
.dh .st .k { font-size: 11px; line-height: 1; color: var(--ink-3); }
.dh .st .v { font: 500 13px/1.2 var(--sign); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh .st .v b { font-size: 17px; font-weight: 600; }
.db { flex: 1; overflow: auto; padding: 20px 24px 48px; }
.df { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--rule); }
.df button { height: 34px; padding: 0 14px; border: 1px solid var(--rule); background: var(--card); border-radius: 9px; font-weight: 500; }
.df button:hover { border-color: var(--rule-2); }
.df button:first-child { background: var(--ink); border-color: var(--ink); color: #fff; }
.df button:first-child:hover { background: #2A3644; }

/* 「你」用线路色的站点圈，Claude 用橙色圆点 */
.who { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; font: 600 12.5px/1 var(--body); color: var(--ink-2); }
.who:first-child { margin-top: 0; }
.who::before { content: ""; flex: none; width: 20px; height: 20px; border-radius: 50%; }
.who.you::before { background: #fff; box-shadow: inset 0 0 0 5px var(--c); }
.who.ai::before { content: "C"; display: grid; place-items: center; font: 600 11px/1 var(--sign); color: #fff; background: #D97757; }
.prompt { max-width: 72ch; padding: 11px 15px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.65; background: color-mix(in srgb, var(--c) 7%, #fff); border: 1px solid color-mix(in srgb, var(--c) 24%, #fff); border-radius: 4px 14px 14px 14px; }
.prompt.queued { margin: 12px 0; font-size: 13.5px; background: var(--paper-2); border: 1px dashed var(--rule-2); }
.prompt.queued::before { content: "中途插话"; display: block; margin-bottom: 6px; font: 600 11px/1 var(--body); letter-spacing: .08em; color: var(--ink-3); }
/* 长回复里屏幕外的段落先不排版（中文字形回退排版很贵，一轮几千字能占十几毫秒），滚到时再排 */
#dBody .md > *, #dBody > :not(.md) { content-visibility: auto; contain-intrinsic-size: auto 48px; }
.md { max-width: 72ch; margin: 4px 0 14px; font-size: 14.5px; line-height: 1.75; color: #1E2935; word-break: break-word; }
.md p { margin: 0 0 .8em; }
.md h1, .md h2, .md h3, .md h4 { margin: 1.2em 0 .45em; font-size: 15.5px; line-height: 1.4; color: var(--ink); }
.md h1 { font-size: 18px; }
.md h2 { font-size: 16.5px; padding-bottom: .3em; border-bottom: 1px solid var(--rule); }
.md ul, .md ol { margin: 0 0 .8em; padding-left: 1.5em; }
.md li { margin: .2em 0; }
.md li::marker { color: var(--ink-3); }
.md strong { color: var(--ink); }
.md code { padding: 1px 5px; font: 12.5px var(--mono); background: #F0F3F2; border: 1px solid #E1E6E4; border-radius: 5px; }
.md pre { margin: 0 0 .9em; padding: 14px 16px; overflow: auto; font: 12.5px/1.6 var(--mono); color: #E3EAE8; background: #18212C; border-radius: 10px; }
.md pre code { padding: 0; font: inherit; color: inherit; background: none; border: 0; }
.md blockquote { margin: 0 0 .8em; padding: 1px 0 1px 14px; color: var(--ink-2); border-left: 3px solid color-mix(in srgb, var(--c) 40%, #fff); }
.md table { display: block; overflow: auto; margin: 0 0 1em; border-collapse: collapse; font-size: 13px; }
.md th, .md td { padding: 6px 10px; text-align: left; vertical-align: top; border: 1px solid var(--rule); }
.md th { background: var(--paper-2); }
.md a { color: var(--link); text-decoration: underline; text-decoration-color: rgba(27, 111, 176, .35); text-underline-offset: 3px; }
.md a:hover { text-decoration-color: currentColor; }
/* 不是 http/https/mailto 的链接只显示文字，目标放在提示里 */
.md .lk { border-bottom: 1px dotted var(--ink-3); cursor: help; }
.md hr { margin: 1.2em 0; border: 0; border-top: 1px solid var(--rule); }
/* 解析时替换掉的密钥 */
.rd { display: inline-block; padding: 1px 7px 1px 6px; font: 600 11.5px/16px var(--body); font-style: normal; white-space: nowrap; vertical-align: 1px; color: var(--ok); background: var(--ok-bg); border: 1px dashed #8CCBBE; border-radius: 6px; }
.rd::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 4px; vertical-align: 1px; border: 1.5px solid currentColor; border-radius: 50%; }

/* 工具、思考的折叠块用普通按钮实现：几百个 <details> 各带一棵 shadow tree，打开大轮次时明显拖慢 */
.fold { margin: 2px 0; font-size: 13px; }
.fold .hd { display: flex; gap: 8px; align-items: center; }
.fold .sum { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; padding: 5px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); text-align: left; }
.fold .sum::before { content: ""; flex: none; width: 6px; height: 6px; margin: 0 3px 0 1px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); transition: transform .12s; }
.fold.open .sum::before { transform: rotate(45deg); }
.fold .sum:disabled { cursor: default; }
.fold .sum:disabled::before { visibility: hidden; }
.fold .sum:not(:disabled):hover { background: var(--paper-2); }
.fold .n { flex: none; min-width: 56px; padding: 0 8px; font: 600 12px/20px var(--sign); text-align: center; color: var(--ink); background: #EDF1F0; border-radius: 6px; }
.fold .s { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); }
.fold.err .n { color: var(--bad); background: var(--bad-bg); }
.fold .bad { flex: none; padding: 0 8px; font: 600 11px/18px var(--body); color: #fff; background: var(--bad); border-radius: 9px; }
.fold.think .sum { font-weight: 600; color: #6E5A9A; }
.fold .bd { display: none; padding: 0 0 8px 22px; }
.fold.open .bd { display: block; }
.fold pre { margin: 6px 0 0; padding: 10px 12px; max-height: 360px; overflow: auto; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; color: #26313C; background: var(--paper-2); border: 1px solid #E1E6E4; border-radius: 9px; }
.fold pre.in::before, .fold pre.out::before { display: block; margin-bottom: 7px; font: 600 10.5px/1 var(--body); letter-spacing: .12em; color: var(--ink-3); }
.fold pre.in::before { content: "输入"; }
.fold pre.out::before { content: "输出"; }
.fold.err pre.out { background: #FFF8F6; border-color: #F1CEC6; }
.fold.think pre { font: 13px/1.7 var(--body); color: var(--ink-2); background: #F8F6FC; border-color: #E7E1F3; }
.jump { flex: none; height: 26px; padding: 0 10px; font-size: 12px; color: var(--ink-2); background: var(--card); border: 1px dashed var(--agent); border-radius: 7px; }
.jump:hover { border-style: solid; border-color: var(--ink-2); color: var(--ink); }
.note { margin: 8px 0; padding: 7px 12px; font-size: 12.5px; color: var(--ink-2); white-space: pre-wrap; background: var(--paper-2); border-radius: 8px; }
.cut { display: flex; align-items: center; gap: 10px; margin: 18px 0; font: 600 11.5px/1 var(--sign); color: var(--ink-2); }
.cut::before, .cut::after { content: ""; flex: 1; border-top: 1.5px dashed var(--rule-2); }
.empty { position: fixed; inset: 56px 0 0; display: grid; place-items: center; color: var(--ink-2); }
.empty div { max-width: 420px; padding: 28px 32px; text-align: center; line-height: 1.7; background: var(--card); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--float); }

@media (max-width: 1440px) { .stats .range { display: none; } }
@media (max-width: 1220px) { .stats, .top h1 small { display: none; } }
@media (max-width: 900px) {
  .hint, #mini, .lines { display: none; }
  .search { width: 40vw; }
  .group .tbtn::before { display: none; }
}
@media (prefers-reduced-motion: reduce) { .drawer, .drawer.open { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand" aria-hidden="true"><!--__BRAND__--></div>
  <h1 id="pname"></h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <label class="search" title="搜索提问、回复和工具调用（快捷键 /）">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="搜索这个项目的对话" autocomplete="off">

    <button class="tbtn" id="tTools" aria-pressed="true" title="详情里显示工具调用">工具</button>

<div id="vp"><div id="world"><svg id="edges"></svg></div></div>

<div class="zoom">

</div>
<div class="hint"><span>拖动或滚轮平移</span><i></i><kbd>Shift</kbd><span>+滚轮 上下</span><i></i><kbd>Ctrl</kbd><span>+滚轮 缩放</span><i></i><kbd>←</kbd><kbd>→</kbd><span>沿线路切换</span><i></i><kbd>/</kbd><span>搜索</span></div>

<aside class="drawer" id="drawer" aria-label="回复详情">
  <div class="dh">
    <div class="l1">
      <span class="no" id="dNo"></span><span class="lt" id="dLane"></span>
      <button id="dUp" title="回到发起它的那一轮"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 14.5 4.5 9.5l5-5"/><path d="M4.5 9.5h10a5 5 0 0 1 0 10H13"/></svg>发起处</button>

      <button id="dNext" title="下一站（→）" aria-label="下一站"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg></button>

    </div>

  </div>

<script id="ctx-data" type="application/json">__DATA__</script>
<!--__BULK__-->
<script>
/*__EXPORT_MD__*/

const DATA = JSON.parse(document.getElementById('ctx-data').textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 解析时密钥已被换成这串占位（parse.mjs 的 HIDDEN），这里只是把它画成标签。替换内容不含引号，落进属性值里也闭合不了
const HIDDEN = '[密钥已隐藏]';
const chipHidden = (html) => (html.includes(HIDDEN) ? html.split(HIDDEN).join('<i class=rd>密钥已隐藏</i>') : html);

// 工具输入输出按轮存在单独的块里（见 render.mjs 的 splitBulk），展开时才解析那一轮
const chunkCache = new Map();
let bulkText = null;
const chunk = (b) => {
  if (!chunkCache.has(b)) {
    bulkText ??= document.getElementById('ctx-bulk')?.textContent || '';
    const at = DATA.bulk?.[b], end = DATA.bulk?.[b + 1];
    chunkCache.set(b, at == null || end == null ? [] : JSON.parse(bulkText.slice(at, end)));
  }
  return chunkCache.get(b);
};
const toolInput = (it) => it.input ?? (it.iv == null ? '' : chunk(it.b)[it.iv]);
const toolResult = (it) => it.result ?? (it.rv == null ? '' : chunk(it.b)[it.rv]);
let hydrated = false;
function hydrate() { // 导出 JSON 前把正文放回条目里，导出结果和拆分前一致
  if (hydrated) return;
  hydrated = true;
  for (const t of DATA.turns) for (const it of t.items) {
    if (it.b == null) continue;
    if (it.iv != null) it.input = chunk(it.b)[it.iv];
    if (it.rv != null) it.result = chunk(it.b)[it.rv];
    delete it.b; delete it.iv; delete it.rv;
  }
  delete DATA.bulk;
}

// ---------- 数据索引 ----------
const byId = new Map(DATA.turns.map((t) => [t.id, t]));
const laneOf = new Map(DATA.lanes.map((l) => [l.key, l]));
const laneTurns = new Map();
for (const t of DATA.turns) {
  if (!laneTurns.has(t.lane)) laneTurns.set(t.lane, []);
  laneTurns.get(t.lane).push(t);
}
const idxOf = new Map();
for (const list of laneTurns.values()) list.forEach((t, i) => idxOf.set(t.id, i + 1));

const LINE_COLORS = ['#D7263D', '#1B7FC4', '#2A9D5C', '#E08A00', '#8E44AD', '#00989A', '#D6457A', '#6B7F2A', '#C0561E', '#3D5A98', '#7A5C3E', '#0F7B6C'];
let sn = 0;
for (const l of DATA.lanes) {
  if (l.kind === 'session') { l.no = `S${++sn}`; l.color = LINE_COLORS[(sn - 1) % LINE_COLORS.length]; }
}
// 子代理按所属会话依次编号；计数顺带给线路列表用。几百条线路时逐条回头筛兄弟线路是平方级
const agentCount = new Map();
for (const l of DATA.lanes) {
  if (l.kind !== 'agent') continue;
  const parent = laneOf.get(l.sessionId);
  const n = (agentCount.get(l.sessionId) || 0) + 1;
  agentCount.set(l.sessionId, n);
  l.color = parent?.color || '#8F9AA6';
  l.no = `${parent?.no || 'S'}·${n}`;
}

const state = { agents: false, openAgents: new Set(), tools: true, think: false, lines: true, sel: null, hits: [], hitSet: new Set(), hitPos: -1 };
const W = 280, H = 150, COL = 320, ROW_RAIL = 22, ROW_CARD = 44, ROW = 44 + H + 34;
const ROOT_X = 0, FIRST_COL_X = 300;

const fmtTime = (ts) => {
  if (!ts) return '';
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const fmtDur = (a, b) => {
  const s = Math.max(0, (new Date(b) - new Date(a)) / 1000);
  if (s < 60) return `${Math.round(s)} 秒`;
  if (s < 3600) return `${Math.round(s / 60)} 分钟`;
  return `${(s / 3600).toFixed(1)} 小时`;
};
const kfmt = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 100000 ? 0 : 1)}k` : String(n || 0));
const ctxLimit = (t) => ((t.models || []).some((m) => /\[1m\]/i.test(m)) || t.ctx > 200000 ? 1000000 : 200000);

// ---------- 树与布局 ----------
let layout = null;

// 子代理默认收起：发起它的那一轮被展开（或全局展开）时才画出来
function laneShown(lane, memo = new Map()) {
  if (lane.kind !== 'agent') return true;
  if (memo.has(lane.key)) return memo.get(lane.key);
  const origin = lane.parentTurn && byId.get(lane.parentTurn);
  const ok = !!origin && (state.agents || state.openAgents.has(origin.id)) && laneShown(laneOf.get(origin.lane), memo);
  memo.set(lane.key, ok);
  return ok;
}

function buildLayout() {
  const memo = new Map();
  const visible = DATA.turns.filter((t) => laneShown(laneOf.get(t.lane), memo));
  const vis = new Set(visible.map((t) => t.id));
  const kids = new Map([['ROOT', []]]);
  const parentOf = new Map();
  for (const t of visible) {
    let p = t.parent && vis.has(t.parent) ? t.parent : null;
    const lane = laneOf.get(t.lane);
    if (!p && !t.parent && lane?.kind === 'agent' && vis.has(lane.parentTurn)) p = lane.parentTurn;
    const key = p || 'ROOT';
    parentOf.set(t.id, key);
    if (!kids.has(key)) kids.set(key, []);
    kids.get(key).push(t);
  }
  // 同一线路的下一站排在最前（沿横轴延续），其余分叉按时间往下排
  for (const [key, list] of kids) {
    const pl = key === 'ROOT' ? null : byId.get(key).lane;
    // 时间是 ISO 字符串，直接按字符比较；localeCompare 走 ICU，上千轮时能占一半布局时间
    const ta = (x) => x.t0 || '';
    list.sort((a, b) => (a.lane === pl ? 0 : 1) - (b.lane === pl ? 0 : 1) || (ta(a) < ta(b) ? -1 : ta(a) > ta(b) ? 1 : 0));
  }

  const pos = new Map();
  const rows = []; // 每行已占用的列区间
  const rowEnd = []; // 每行占用到的最右一列：新区间在它右边就不用逐个比了（按时间摆放时绝大多数是这种）
  const branches = [];
  const free = (r, c0, c1) => !(rowEnd[r] >= c0) || !rows[r].some(([a, b]) => a <= c1 && c0 <= b);
  const findRow = (minRow, c0, c1) => { let r = minRow; while (!free(r, c0, c1)) r++; return r; };

  const place = (start, parentRow, col) => {
    const chain = [start];
    for (;;) {
      const last = chain[chain.length - 1];
      const next = (kids.get(last.id) || []).find((c) => c.lane === last.lane);
      if (!next) break;
      chain.push(next);
    }
    const c1 = col + chain.length - 1;
    const row = findRow(Math.max(0, parentRow + 1), col - 1, c1);
    (rows[row] ||= []).push([col - 1, c1]);
    rowEnd[row] = Math.max(rowEnd[row] ?? -Infinity, c1);
    chain.forEach((t, i) => pos.set(t.id, { col: col + i, row }));
    branches.push({ lane: start.lane, first: start, last: chain[chain.length - 1], row, col, parent: parentOf.get(start.id) });
    const inChain = new Set(chain);
    for (const t of chain) {
      for (const c of kids.get(t.id) || []) if (!inChain.has(c)) place(c, row, pos.get(t.id).col + 1);
    }
  };
  for (const s of kids.get('ROOT')) place(s, -1, 0);

  const x = (col) => FIRST_COL_X + col * COL;
  const y = (row) => 70 + row * ROW;
  let maxCol = 0, maxRow = 0;
  for (const p of pos.values()) { maxCol = Math.max(maxCol, p.col); maxRow = Math.max(maxRow, p.row); }
  layout = { pos, kids, parentOf, branches, x, y, visible,
    width: x(maxCol) + W + 200, height: y(maxRow) + ROW + 60 };
}

function stationOf(id) {
  const p = layout.pos.get(id);
  return { x: layout.x(p.col) + 22, y: layout.y(p.row) + ROW_RAIL };
}

// 卡片只建一次：重新布局（展开子代理等）时只挪位置，省掉重建 DOM 和整页重新排版。
// 先建空壳（.shell），近看时再按帧分批填文字（fillCard），见 upgradeCards
const cardEls = new Map();
const badgeEls = new Map();  // 线路牌也按视口挂载，键是线路 id
let badges = [];
function buildCard(t) {
  const lane = laneOf.get(t.lane);
  const el = document.createElement('div');
  el.className = `card shell${lane.kind === 'agent' ? ' agent' : ''}`;
  el.dataset.id = t.id;
  el.style.setProperty('--c', lane.color);
  return el;
}
function fillCard(el, t) {
  const pct = Math.min(100, (t.ctx / ctxLimit(t)) * 100);
  const toolN = Object.values(t.tools).reduce((a, b) => a + b, 0);
  const foot = [];
  if (toolN) foot.push(`<span>工具 ${toolN}</span>`);
  if (t.agents.length) foot.push(`<button class="agt" data-agt="${esc(t.id)}"></button>`);
  if (t.compactions.length) foot.push(`<span>压缩 ${t.compactions.length} 次</span>`);
  if (t.items.some((i) => i.k === 'queued')) foot.push('<span>含插话</span>');
  if (t.interrupted) foot.push('<span class="warn">已中断</span>');
  if (t.errors) foot.push(`<span class="warn">出错 ${t.errors}</span>`);
  // 卡片只露两三行，没必要把几千字的全文塞进去排版
  el.innerHTML = `<div class="meta"><span class="idx">${idxOf.get(t.id)}</span><span>${fmtTime(t.t0)}</span>`
    + `<span class="ctx${pct > 80 ? ' hot' : ''}" title="上下文占用 ${t.ctx.toLocaleString()} tokens">${kfmt(t.ctx)}<i style="--p:${pct}%"></i></span></div>`
    + `<div class="q">${chipHidden(esc(t.prompt.slice(0, 200)))}</div><div class="a">${chipHidden(esc(plain(t.items.findLast((i) => i.k === 'text')?.text.slice(0, 800)).slice(0, 240)))}</div><div class="foot">${foot.join('')}</div>`;
  el.classList.toggle('q1', oneLine(t.prompt));
  el.dataset.full = '1';
}
// 粗估提问能不能一行放下（提问栏约 250px 宽，汉字约 13px，其余约 7.5px），放得下就让回复多露一行。估错只是少露或截掉一行
function oneLine(s) {
  let w = 0;
  for (let i = 0; i < s.length && i < 40; i++) if ((w += s.charCodeAt(i) > 0x2E7F ? 13 : 7.5) > 236) return false;
  return true;
}
function syncAgentButton(el, t) {
  const b = el.querySelector('.agt');
  if (!b) return;
  const open = state.agents || state.openAgents.has(t.id);
  if (b.dataset.open === String(open)) return;
  b.dataset.open = String(open);
  b.setAttribute('aria-expanded', String(open));
  b.title = `${open ? '收起' : '展开'}这一轮派出的子代理`;
  b.textContent = `子代理 ${t.agents.length} ${open ? '▴' : '▾'}`;
}

let rendered = false;
function render() {
  const world = $('world');
  world.querySelectorAll('.terminus').forEach((n) => n.remove());
  world.style.width = `${layout.width}px`;
  world.style.height = `${layout.height}px`;
  const svg = $('edges');
  svg.setAttribute('width', layout.width);
  svg.setAttribute('height', layout.height);

  const paths = [], stations = [];
  const rootKids = layout.kids.get('ROOT') || [];
  const barX = FIRST_COL_X - 44;

  // 起点站：项目本身
  const term = document.createElement('div');
  term.className = 'terminus';
  term.style.left = `${ROOT_X + 20}px`;
  term.style.top = `${layout.y(0)}px`;
  term.innerHTML = `<div class="name${DATA.project.name.length > 12 ? ' long' : ''}">${esc(DATA.project.name)}</div><div class="path">${esc(DATA.project.cwd || DATA.project.dir)}</div>`;
  world.appendChild(term);
  if (rootKids.length) {
    const ys = rootKids.map((t) => stationOf(t.id).y);
    paths.push(`<path d="M${barX} ${Math.min(...ys) - 14}V${Math.max(...ys) + 14}" stroke="#17202B" stroke-width="10" stroke-linecap="round"/>`);
  }

  const laneStroke = (lane) => (lane.kind === 'agent'
    ? `stroke="${lane.color}" stroke-opacity=".55" stroke-width="3" stroke-dasharray="7 6"`
    : `stroke="${lane.color}" stroke-width="7"`);

  const nextBadges = [];
  for (const b of layout.branches) {
    const lane = laneOf.get(b.lane);
    const s = stationOf(b.first.id);
    let d;
    if (b.parent === 'ROOT') d = `M${barX} ${s.y}H${s.x}`;
    else {
      const p = stationOf(b.parent);
      const mx = p.x + COL / 2 + 8, r = 14;
      d = p.y === s.y ? `M${p.x} ${p.y}H${s.x}`
        : `M${p.x} ${p.y}H${mx - r}L${mx} ${p.y + r}V${s.y - r}L${mx + r} ${s.y}H${s.x}`;
    }
    const end = stationOf(b.last.id);
    if (end.x > s.x) d += `M${s.x} ${s.y}H${end.x}`;
    paths.push(`<path d="${d}" fill="none" ${laneStroke(lane)} stroke-linejoin="round" stroke-linecap="round"/>`);

    nextBadges.push({ b, x: s.x + 16, y: s.y - 36 });
  }
  const keep = new Set(nextBadges.map((n) => n.b.lane));
  for (const [id, el] of badgeEls) if (!keep.has(id) && el.isConnected) el.remove();
  badges = nextBadges;

  // 站点互不重叠，同样式的圆合成一条 path（每个圆两段弧）：上千个 <circle> 解析和排版都慢，合并后只剩几十个元素
  const shown = new Set(), dots = new Map(), rings = [];
  const circle = (x, y, r) => `M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
  for (const t of layout.visible) {
    const lane = laneOf.get(t.lane);
    const st = stationOf(t.id);
    if (t.compactions.length) rings.push(circle(st.x, st.y, 12));
    const r = lane.kind === 'agent' ? 5 : 7.5;
    const key = `fill="${t.interrupted ? '#EEF1F0' : '#fff'}" stroke="${lane.kind === 'agent' ? '#8F9AA6' : lane.color}" data-r="${r}"`;
    if (!dots.has(key)) dots.set(key, []);
    dots.get(key).push(circle(st.x, st.y, r));
    shown.add(t.id);
  }
  if (rings.length) stations.push(`<path d="${rings.join('')}" fill="none" stroke="#17202B" stroke-width="1.5" stroke-dasharray="3 3"/>`);
  for (const [key, ds] of dots) stations.push(`<path d="${ds.join('')}" ${key} stroke-width="3.5"/>`);
  for (const [id, el] of cardEls) if (!shown.has(id) && el.isConnected) el.remove();
  svg.innerHTML = paths.join('') + stations.join('');
  cardRangeKey = '';
  updateCards(rendered, true);
  upgradeCards(rendered ? 40 : Infinity);  // 首屏一次填完；之后的重新布局也多填一些，剩下的按帧补
  rendered = true;
  drawMiniBase();
  drawMini();
}

// 卡片虚拟化：上千轮时不能全挂在 DOM 里，只挂视口附近的（线路和站点还是全画，它们便宜）
let cardRangeKey = '';
const BADGE_W = 640;  // 线路牌宽度的上限（标题最宽 420 加编号和日期），只用来判断是否进入视口
function buildBadge(b) {
  const lane = laneOf.get(b.lane);
  const el = document.createElement('div');
  el.className = `badge${lane.kind === 'agent' ? ' agent' : ''}`;
  el.style.setProperty('--c', lane.color);
  const sub = lane.kind === 'agent' ? lane.agentType : `${fmtTime(lane.start)}  ${lane.turnCount} 轮`;
  el.innerHTML = `<span class="no">${esc(lane.no)}</span><span class="t">${esc(lane.title)}</span><span class="d">${esc(sub)}</span>`;
  el.title = lane.title;
  return el;
}
function decorate(el, t) {
  const hits = state.hitSet;
  el.classList.toggle('hit', !!hits && hits.has(t.id));
  el.classList.toggle('dim', !!state.q && !(hits && hits.has(t.id)));
  el.classList.toggle('sel', t.id === state.sel);
  syncAgentButton(el, t);
}
const FAR_K = 0.4, FILL_PER_FRAME = 8;
let far = false, fillReq = 0;
function setFar(k) {
  const f = k < FAR_K;
  if (f === far) return;
  far = f;
  cardRangeKey = '';
  // 缩远时已经排好版的卡片保持原样：整批退回骨架要重算样式，正好卡在缩放那一帧；只有新挂上的才用骨架
  if (!far) scheduleUpgrade();
}
function scheduleUpgrade() { if (!fillReq && !far) fillReq = requestAnimationFrame(() => upgradeCards(FILL_PER_FRAME)); }
// 把视口里的空壳卡片换成完整卡片：离视口中心近的先填，每帧限量，剩下的下一帧继续
function upgradeCards(budget) {
  cancelAnimationFrame(fillReq);
  fillReq = 0;
  if (far) return;
  const shells = [...world.getElementsByClassName('shell')];
  if (!shells.length) return;
  const cx = (vpSize.w / 2 - view.x) / view.k, cy = (vpSize.h / 2 - view.y) / view.k;
  const dist = (el) => Math.abs(parseFloat(el.style.left) + W / 2 - cx) + Math.abs(parseFloat(el.style.top) + H / 2 - cy);
  if (shells.length > budget) shells.sort((a, b) => dist(a) - dist(b));
  for (const el of shells.slice(0, budget)) {
    const t = byId.get(el.dataset.id);
    if (!el.dataset.full) fillCard(el, t);
    el.classList.remove('shell');
    syncAgentButton(el, t);
  }
  if (shells.length > budget) scheduleUpgrade();
}
// 已挂着的卡片由 applyMarks 维护高亮/选中状态，平移时只给新挂上的卡片补；重新布局时（every）全部过一遍
function updateCards(fade, every = false) {
  const pad = 300;
  const wx0 = (-view.x - pad) / view.k, wx1 = (vpSize.w - view.x + pad) / view.k;
  const wy0 = (-view.y - pad) / view.k, wy1 = (vpSize.h - view.y + pad) / view.k;
  const frag = document.createDocumentFragment();
  const anim = fade && !reduceMotion.matches;
  for (const t of layout.visible) {
    const p = layout.pos.get(t.id);
    const x = layout.x(p.col), y = layout.y(p.row) + ROW_CARD;
    const old = cardEls.get(t.id);
    if (x > wx1 || x + W < wx0 || y > wy1 || y + H < wy0) { if (old?.isConnected) old.remove(); continue; }
    const mount = !old?.isConnected;
    if (!mount && !every) continue;
    const el = old || buildCard(t);
    if (!old) cardEls.set(t.id, el);
    const left = `${x}px`, top = `${y}px`;
    if (el.style.left !== left) el.style.left = left;
    if (el.style.top !== top) el.style.top = top;
    decorate(el, t);
    if (mount) {
      if (far) el.classList.add('shell');
      // 只给「展开子代理」这类布局变化里第一次出现的卡片淡入；平移滚出来的不闪
      if (anim && !el.dataset.mounted) { el.classList.add('enter'); el.addEventListener('animationend', () => el.classList.remove('enter'), { once: true }); }
      el.dataset.mounted = '1';
      frag.appendChild(el);
    }
  }
  for (const { b, x, y } of badges) {
    const old = badgeEls.get(b.lane);
    if (x > wx1 || x + BADGE_W < wx0 || y > wy1 || y + 24 < wy0) { if (old?.isConnected) old.remove(); continue; }
    if (old?.isConnected && !every) continue;
    const el = old || buildBadge(b);
    if (!old) badgeEls.set(b.lane, el);
    el.dataset.first = b.first.id;
    const left = `${x}px`, top = `${y}px`;
    if (el.style.left !== left) el.style.left = left;
    if (el.style.top !== top) el.style.top = top;
    if (!el.isConnected) frag.appendChild(el);
  }
  world.appendChild(frag);
  if (!far && world.getElementsByClassName('shell').length) scheduleUpgrade();
}

// ---------- Markdown ----------
function plain(md) {
  return String(md || '')
    .replace(/```[\s\S]*?(```|$)/g, ' [代码] ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '[图片]')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '· ')
    .replace(/\*\*|__|~~/g, '')
    .replace(/\|/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 400);
}

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    // 只有 http(s)、mailto 和页内锚点做成真链接；javascript:、file:、相对路径这类一律只显示文字，目标放进提示。
    // 地址里不收占位符，代码片段替换回来时就不会落进 href
    .replace(/\[([^\]]+)\]\(([^)\s\u0000]+)\)/g, (m, text, url) => (/^(https?:\/\/|mailto:|#)/i.test(url)
      ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>` : `<span class="lk" title="${url}">${text}</span>`));
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}

function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const isTableStart = (j) => lines[j].includes('|') && j + 1 < lines.length && isTableSep(lines[j + 1]);
  const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
  while (i < lines.length) {
    const l = lines[i];
    const fence = l.match(/^\s*(```+|~~~+)\s*([\w+-]*)/);
    if (fence) {
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = Math.min(4, h[1].length); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (isTableStart(i)) {
      const head = cells(l);
      i += 2;
      const body = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) body.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`);
      continue;
    }
    const li = l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (li) {
      const ordered = /\d/.test(li[2]);
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m && m[1].length <= li[1].length + 1) { items.push([m[3]]); i++; continue; }
        if (lines[i].trim() && /^\s{2,}/.test(lines[i]) && items.length) { items[items.length - 1].push(lines[i].trim()); i++; continue; }
        break;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>${items.map((it) => `<li>${inline(it[0])}${it.length > 1 ? md(it.slice(1).join('\n')) : ''}</li>`).join('')}</${tag}>`);
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*```|\s*>|\s*([-*+]|\d+[.)])\s)/.test(lines[i])
      && !isTableStart(i)) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}

// ---------- 视图：平移 / 缩放 ----------
// 所有移动都先改 view，再由 applyView() 合并到下一帧统一写入，一帧最多写一次 transform。
// 画布平时就是独立的合成层，平移只需合成、不重绘；缩放停下后再按新比例重新栅格化一次，文字保持清晰。
const vp = $('vp'), world = $('world');
// 视口尺寸缓存起来：平移途中读 clientWidth，会在刚挂上新卡片时强制同步重排一次
const vpSize = { w: vp.clientWidth, h: vp.clientHeight };
const view = { x: 0, y: 0, k: 0.9 };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const cam = { aim: null, glide: null, req: 0, last: 0 };
// 正在朝某个缩放值缓动时，新的缩放操作要基于那个目标值叠加，而不是当前帧的中间值
const aimK = () => (cam.aim?.anchor ? cam.aim.k : view.k);
let paintedK = view.k, rasterTimer = 0;

function paintView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  // 平移/缩放跨过一格（120px）才重算该挂哪些卡片，其余帧只动 transform
  if (layout) {
    setFar(view.k);
    const key = `${Math.round(view.x / 120)}|${Math.round(view.y / 120)}|${Math.round(view.k * 50)}`;
    if (key !== cardRangeKey) { cardRangeKey = key; updateCards(false); }
  }
  drawMini();
  if (view.k !== paintedK) {
    paintedK = view.k;
    clearTimeout(rasterTimer);
    rasterTimer = setTimeout(() => {
      world.style.willChange = 'auto';
      requestAnimationFrame(() => { world.style.willChange = ''; });
    }, 160);
  }
}
function applyView() {
  if (!cam.req) cam.req = requestAnimationFrame(tick);
}
function tick(now) {
  cam.req = 0;
  const dt = cam.last ? Math.min(48, now - cam.last) : 16;
  cam.last = now;
  if (cam.aim) {
    // 指数逼近目标：连续滚动、连按方向键时会从当前位置平滑地改道，不会重新起步
    const a = cam.aim, f = 1 - Math.exp(-dt / 70);
    if (a.anchor) {
      view.k += (a.k - view.k) * f;
      view.x = a.anchor.mx - a.anchor.wx * view.k;
      view.y = a.anchor.my - a.anchor.wy * view.k;
      if (Math.abs(a.k - view.k) < 0.0005) { view.k = a.k; view.x = a.anchor.mx - a.anchor.wx * a.k; view.y = a.anchor.my - a.anchor.wy * a.k; cam.aim = null; }
    } else {
      view.x += (a.x - view.x) * f;
      view.y += (a.y - view.y) * f;
      if (Math.abs(a.x - view.x) < 0.4 && Math.abs(a.y - view.y) < 0.4) { view.x = a.x; view.y = a.y; cam.aim = null; }
    }
  } else if (cam.glide) {
    // 松手后的惯性：速度按指数衰减
    const g = cam.glide;
    view.x += g.vx * dt;
    view.y += g.vy * dt;
    const decay = Math.exp(-dt / 320);
    g.vx *= decay; g.vy *= decay;
    if (Math.hypot(g.vx, g.vy) < 0.015) cam.glide = null;
  }

}
function stopMotion() { cam.aim = null; cam.glide = null; }
function aimAt(x, y) {

}
function zoomAt(k, mx, my, smooth) {
  cam.glide = null;
  k = Math.max(0.12, Math.min(2, k));
  if (!smooth || reduceMotion.matches) {
    // 先落到正在进行的缩放终点，再以鼠标所在点为中心缩放
    if (cam.aim?.anchor) { view.k = cam.aim.k; view.x = cam.aim.anchor.mx - cam.aim.anchor.wx * view.k; view.y = cam.aim.anchor.my - cam.aim.anchor.wy * view.k; }
    cam.aim = null;
    view.x = mx - ((mx - view.x) * k) / view.k;
    view.y = my - ((my - view.y) * k) / view.k;
    view.k = k;
  } else {
    const same = cam.aim?.anchor && Math.abs(cam.aim.anchor.mx - mx) < 3 && Math.abs(cam.aim.anchor.my - my) < 3;
    const anchor = same ? cam.aim.anchor : { mx, my, wx: (mx - view.x) / view.k, wy: (my - view.y) / view.k };

function fit() {
  const w = vpSize.w, h = vpSize.h;
  const k = Math.max(0.12, Math.min(1, (w - 40) / layout.width, (h - 40) / layout.height));
  stopMotion();
  view.k = k; view.x = 20; view.y = 20;

}
// 两侧浮层的宽度直接按 CSS 算，不去读 offsetWidth——刚换完详情内容时读它会强制整页同步排版
function viewInsets() {
  const wide = innerWidth > 900;
  return {
    left: state.lines && wide ? 12 + 272 : 0,
    right: $('drawer').classList.contains('open') ? Math.min(640, innerWidth) : 0,
  };
}
function centerOn(id, smooth) {
  const p = layout.pos.get(id);
  if (!p) return;
  const cx = layout.x(p.col) + W / 2, cy = layout.y(p.row) + ROW_CARD + H / 2;
  // 在左侧线路面板和右侧详情之间的空白区域居中
  const { left, right } = viewInsets();
  const tx = (left + vpSize.w - right) / 2 - cx * view.k, ty = vpSize.h / 2 - cy * view.k;
  if (smooth) aimAt(tx, ty);
  else { stopMotion(); view.x = tx; view.y = ty; applyView(); }
}
function isVisible(id) {
  const p = layout.pos.get(id);
  const x0 = layout.x(p.col) * view.k + view.x, y0 = (layout.y(p.row) + ROW_CARD) * view.k + view.y;
  const { left, right } = viewInsets();
  return x0 > left && y0 > 0 && x0 + W * view.k < vpSize.w - right && y0 + H * view.k < vpSize.h;
}

// 鼠标滚轮一格是几十上百像素的跳变，要缓动；触控板本身连续，直接跟手，并且两个方向都能滑
const isMouseWheel = (e) => e.deltaMode !== 0 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50);
vp.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? vpSize.h : 1;
  const dx = e.deltaX * unit, dy = e.deltaY * unit;
  const mouse = isMouseWheel(e);
  if (e.ctrlKey || e.metaKey) { zoomAt(aimK() * Math.exp(-dy * (mouse ? 0.0015 : 0.01)), e.clientX - r.left, e.clientY - r.top, mouse); return; }
  if (!mouse) { stopMotion(); view.x -= dx; view.y -= dy; applyView(); return; }
  const base = cam.aim && !cam.aim.anchor ? cam.aim : view;
  if (e.shiftKey) aimAt(base.x - dx, base.y - (dy || dx));
  else aimAt(base.x - dx - dy, base.y);
}, { passive: false });

// 拖动：超过 4 像素才算拖，之前一直按点击处理；松手时按最近 100ms 的速度继续滑一段
let drag = null;
vp.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  stopMotion();
  drag = {
    id: e.pointerId, x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false,
    target: e.target.closest('.card'), agt: e.target.closest('.agt'), badge: e.target.closest('.badge'),
    samples: [[e.timeStamp, e.clientX, e.clientY]],
  };
});
vp.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) <= 4) return;
    drag.moved = true;
    vp.setPointerCapture(e.pointerId);
    vp.classList.add('dragging');
  }
  view.x = drag.vx + dx; view.y = drag.vy + dy;
  const s = drag.samples;
  s.push([e.timeStamp, e.clientX, e.clientY]);
  while (s.length > 2 && e.timeStamp - s[0][0] > 100) s.shift();
  applyView();
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  vp.classList.remove('dragging');
  if (d.moved) {
    const s = d.samples, [t0, x0, y0] = s[0];
    const dt = e.timeStamp - t0;
    if (!cancelled && !reduceMotion.matches && dt > 0 && e.timeStamp - s[s.length - 1][0] < 60) {
      const vx = (e.clientX - x0) / dt, vy = (e.clientY - y0) / dt;
      if (Math.hypot(vx, vy) > 0.25) { cam.glide = { vx, vy }; applyView(); }
    }
    return;
  }
  if (cancelled) return;
  if (d.agt) toggleAgentsOf(d.agt.dataset.agt);
  else if (d.target) select(d.target.dataset.id, false);
  else if (d.badge) select(d.badge.dataset.first, true);
}
vp.addEventListener('pointerup', (e) => endDrag(e, false));
vp.addEventListener('pointercancel', (e) => endDrag(e, true));
$('zIn').onclick = () => zoomAt(aimK() * 1.25, vpSize.w / 2, vpSize.h / 2, true);
$('zOut').onclick = () => zoomAt(aimK() / 1.25, vpSize.w / 2, vpSize.h / 2, true);
$('zFit').onclick = fit;

// ---------- 缩略图 ----------
const mini = $('mini'), mctx = mini.getContext('2d');
const miniBase = document.createElement('canvas'); // 卡片点阵只在布局变化时画一次，每帧只叠视口框
let miniScale = 1, miniX = 0, miniY = 0; // 线路图通常又宽又扁，缩放后在缩略图里居中，四周留一点边
const miniRect = (p) => [miniX + layout.x(p.col) * miniScale, miniY + (layout.y(p.row) + ROW_CARD) * miniScale, Math.max(2, W * miniScale), Math.max(2, H * miniScale * 0.6)];
function drawMiniBase() {
  if (!layout) return;
  miniBase.width = mini.width;
  miniBase.height = mini.height;
  const b = miniBase.getContext('2d');
  const pad = 16;
  miniScale = Math.min((mini.width - 2 * pad) / layout.width, (mini.height - 2 * pad) / layout.height);
  miniX = (mini.width - layout.width * miniScale) / 2;
  miniY = (mini.height - layout.height * miniScale) / 2;
  b.globalAlpha = 0.8;
  for (const t of layout.visible) {
    const lane = laneOf.get(t.lane);
    b.fillStyle = lane.kind === 'agent' ? '#B9C2CA' : lane.color;
    b.fillRect(...miniRect(layout.pos.get(t.id)));
  }
}
// 缩略图只在窄屏被 CSS 藏起来；用媒体查询判断，别在每帧读布局——刚挂上新卡片时那一读会强制整页重排
const miniHidden = matchMedia('(max-width: 900px)');
function drawMini() {
  if (!layout || miniHidden.matches) return;
  mctx.clearRect(0, 0, mini.width, mini.height);
  mctx.drawImage(miniBase, 0, 0);
  if (state.sel && layout.pos.has(state.sel)) {
    const lane = laneOf.get(byId.get(state.sel).lane);
    mctx.fillStyle = lane.color;
    mctx.fillRect(...miniRect(layout.pos.get(state.sel)));
  }
  mctx.fillStyle = 'rgba(23, 32, 43, .07)';
  mctx.strokeStyle = '#17202B';
  mctx.lineWidth = 2;
  const vr = [miniX + (-view.x / view.k) * miniScale, miniY + (-view.y / view.k) * miniScale, (vpSize.w / view.k) * miniScale, (vpSize.h / view.k) * miniScale];
  mctx.fillRect(...vr);
  mctx.strokeRect(...vr);
}
function miniJump(e) {
  const r = mini.getBoundingClientRect();
  const wx = ((e.clientX - r.left) * (mini.width / r.width) - miniX) / miniScale;
  const wy = ((e.clientY - r.top) * (mini.height / r.height) - miniY) / miniScale;
  view.x = vpSize.w / 2 - wx * view.k;
  view.y = vpSize.h / 2 - wy * view.k;
  applyView();
}
let miniDrag = false;
mini.addEventListener('pointerdown', (e) => { stopMotion(); miniDrag = true; mini.setPointerCapture(e.pointerId); miniJump(e); });
mini.addEventListener('pointermove', (e) => miniDrag && miniJump(e));
mini.addEventListener('pointerup', () => { miniDrag = false; });

// ---------- 选中与详情 ----------
function laneNeighbors(t) {
  const list = laneTurns.get(t.lane);
  const i = idxOf.get(t.id) - 1;
  return { prev: list[i - 1] || null, next: list[i + 1] || null };
}

function relayout(keepId) {
  // 重新布局后让某张卡片停在屏幕上原来的位置，避免画面跳动
  const before = keepId && layout.pos.has(keepId) ? stationOf(keepId) : null;
  if (before) stopMotion();
  buildLayout();
  render();
  if (before && layout.pos.has(keepId)) {
    const after = stationOf(keepId);
    view.x -= (after.x - before.x) * view.k;
    view.y -= (after.y - before.y) * view.k;
    paintView();  // 和新布局同一帧生效，否则会闪一下
  }
}

function toggleAgentsOf(turnId) {
  if (state.agents) { state.agents = false; $('tAgents').setAttribute('aria-pressed', 'false'); for (const t of DATA.turns) if (t.agents.length) state.openAgents.add(t.id); }
  if (state.openAgents.has(turnId)) state.openAgents.delete(turnId);
  else state.openAgents.add(turnId);
  relayout(turnId);
}

function revealLane(laneKey) {
  let lane = laneOf.get(laneKey);
  let changed = false;
  while (lane && lane.kind === 'agent' && lane.parentTurn) {
    if (!state.openAgents.has(lane.parentTurn)) { state.openAgents.add(lane.parentTurn); changed = true; }
    lane = laneOf.get(byId.get(lane.parentTurn)?.lane);
  }
  if (changed) relayout(state.sel);
}

function select(id, center) {
  const t = byId.get(id);
  if (!t) return;
  if (!layout.pos.has(id)) revealLane(t.lane);
  if (!layout.pos.has(id)) return;
  state.sel = id;
  applyMarks();
  openDrawer(t);
  if (center || !isVisible(id)) centerOn(id, true);
  drawMini();
}

function openDrawer(t) {
  const lane = laneOf.get(t.lane);
  const drawer = $('drawer');
  drawer.style.setProperty('--c', lane.color);
  const no = $('dNo');
  no.textContent = lane.no;
  no.className = `no${lane.kind === 'agent' ? ' agent' : ''}`;
  $('dLane').textContent = lane.kind === 'agent' ? `${lane.agentType} 子代理：${lane.title}` : lane.title;
  $('dLane').title = lane.title;
  const { prev, next } = laneNeighbors(t);
  $('dPrev').disabled = !prev;
  $('dNext').disabled = !next;
  $('dPrev').onclick = () => prev && select(prev.id, true);
  $('dNext').onclick = () => next && select(next.id, true);
  const origin = lane.kind === 'agent' ? lane.parentTurn : null;
  $('dUp').hidden = !origin;
  $('dUp').onclick = () => origin && select(origin, true);

  const total = laneTurns.get(t.lane).length;
  const stat = (k, v) => `<div class="st"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const meta = [
    stat('轮次', `<b>${idxOf.get(t.id)}</b> / ${total}`),
    stat('开始', fmtTime(t.t0)),
    stat('用时', fmtDur(t.t0, t.t1)),
    stat('上下文', t.ctx.toLocaleString()),
    stat('输出', t.out.toLocaleString()),
  ];
  if (t.model) meta.push(stat('模型', esc(t.models.join('、'))));
  if (lane.branch && lane.kind === 'session') meta.push(stat('分支', esc(lane.branch)));
  $('dMeta').innerHTML = meta.join('');

  // 工具输入输出、思考过程默认折叠，展开时才生成内容：大轮次里动辄几百个工具调用，一次全塞进去会卡住点击
  const lazy = [];
  const body = [`<div class="who you">你</div><div class="prompt">${esc(t.prompt)}</div><div class="who ai">Claude</div>`];
  let pendingTools = 0;
  const flushTools = () => {
    if (pendingTools) { body.push(`<div class="note">调用了 ${pendingTools} 次工具（打开顶栏「工具」可查看）</div>`); pendingTools = 0; }
  };
  for (const it of t.items) {
    if (it.k === 'tool' && !state.tools) { pendingTools++; continue; }
    if (it.k === 'think' && !state.think) continue;
    flushTools();
    if (it.k === 'text') body.push(`<div class="md">${md(it.text)}</div>`);
    else if (it.k === 'think') body.push(`<div class="fold think" data-lazy="${lazy.push(it) - 1}"><div class="hd"><button class="sum" aria-expanded="false">思考过程</button></div></div>`);
    else if (it.k === 'tool') {
      const jump = it.agentLane && laneOf.has(it.agentLane) ? `<button class="jump" data-lane="${esc(it.agentLane)}">打开子代理</button>` : '';
      const lz = it.iv != null || it.rv != null || it.input || it.result ? ` data-lazy="${lazy.push(it) - 1}"` : '';
      body.push(`<div class="fold tool${it.err ? ' err' : ''}"${lz}><div class="hd"><button class="sum"${lz ? ' aria-expanded="false"' : ' disabled'}><span class="n">${esc(it.name)}</span><span class="s">${esc(it.sum)}</span>${it.err ? '<span class="bad">失败</span>' : ''}</button>${jump}</div></div>`);
    } else if (it.k === 'queued') body.push(`<div class="prompt queued">${esc(it.text)}</div>`);
    else if (it.k === 'note') body.push(`<div class="note">${esc(it.text)}</div>`);
    else if (it.k === 'compact') body.push(`<div class="cut">上下文压缩 ${kfmt(it.pre)} → ${kfmt(it.post)}${it.trigger === 'manual' ? '（手动）' : ''}</div>`);
  }
  flushTools();
  if (!t.items.some((i) => i.k === 'text')) body.push('<div class="note">这一轮没有文字回复。</div>');
  if (t.interrupted) body.push('<div class="note">这一轮被你中断了。</div>');
  const db = $('dBody');
  db.lazyItems = lazy;
  db.scrollTop = 0;  // 先回顶再换内容：换完再设会强制把新内容同步排版一遍
  db.innerHTML = chipHidden(body.join(''));
  drawer.classList.add('open');
}

function closeDrawer() {
  $('drawer').classList.remove('open');
  state.sel = null;
  applyMarks();
  drawMini();
}
$('dClose').onclick = closeDrawer;
// 折叠块和子代理跳转都在这里统一处理（事件委托，不给每个按钮单独挂监听）
$('dBody').addEventListener('click', (e) => {
  const jump = e.target.closest('.jump');
  if (jump) {
    const first = laneTurns.get(jump.dataset.lane)?.[0];
    if (first) select(first.id, true);
    return;
  }
  const sum = e.target.closest('.sum');
  const fold = sum?.closest('.fold[data-lazy]');
  if (!fold) return;
  if (!fold.dataset.filled) {
    const it = $('dBody').lazyItems[Number(fold.dataset.lazy)];
    fold.dataset.filled = '1';
    const inp = it.k === 'tool' ? toolInput(it) : '', res = it.k === 'tool' ? toolResult(it) : '';
    fold.insertAdjacentHTML('beforeend', chipHidden(`<div class="bd">${it.k === 'think' ? `<pre>${esc(it.text)}</pre>`
      : `${inp ? `<pre class="in">${esc(inp)}</pre>` : ''}${res ? `<pre class="out">${esc(res)}</pre>` : ''}`}</div>`));
  }
  const open = fold.classList.toggle('open');
  sum.setAttribute('aria-expanded', String(open));
});

function contextChain(id) {
  const ids = [];
  let cur = id;
  while (cur && cur !== 'ROOT') {
    ids.push(cur);
    const t = byId.get(cur);
    const lane = laneOf.get(t.lane);
    cur = t.parent || (lane.kind === 'agent' ? lane.parentTurn : null);
  }
  return ids.reverse();
}

// ---------- 搜索 ----------
// 索引在启动后的空闲时间里分片建，第一次搜索就不用等；空闲时间还没建完就当场补完
const haystack = new Map();
let hayDone = 0;
const hayText = (t) => [t.prompt, ...t.items.map((i) => `${i.text || ''} ${i.name || ''} ${i.sum || ''}`)].join('\n').toLowerCase();
function fillHaystack(until = () => true) {
  for (; hayDone < DATA.turns.length && until(); hayDone++) haystack.set(DATA.turns[hayDone].id, hayText(DATA.turns[hayDone]));
}
const idle = window.requestIdleCallback || ((f) => setTimeout(() => { const end = performance.now() + 8; f({ timeRemaining: () => end - performance.now() }); }, 50));
function idleHaystack(deadline) {
  fillHaystack(() => deadline.timeRemaining() > 1);
  if (hayDone < DATA.turns.length) idle(idleHaystack);
}
function runSearch(q) {
  q = q.trim().toLowerCase();
  if (q) fillHaystack();
  // 收起的子代理也参与搜索，跳到那一处时会自动展开
  state.hits = q ? DATA.turns.filter((t) => haystack.get(t.id).includes(q)).map((t) => t.id) : [];
  state.hitPos = -1;
  state.q = q;
  const hidden = state.hits.filter((id) => !layout.pos.has(id)).length;
  $('qcount').textContent = q ? `${state.hits.length} 处${hidden ? `，${hidden} 处在收起的子代理里` : ''}` : '';
  applyMarks();
}
function applyMarks() {
  state.hitSet = new Set(state.hits);
  for (const el of cardEls.values()) if (el.isConnected) decorate(el, byId.get(el.dataset.id));
}
let qTimer;
$('q').addEventListener('input', (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => runSearch(e.target.value), 120); });
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && state.hits.length) {
    state.hitPos = (state.hitPos + (e.shiftKey ? -1 : 1) + state.hits.length) % state.hits.length;
    $('qcount').textContent = `${state.hitPos + 1} / ${state.hits.length}`;
    select(state.hits[state.hitPos], true);
  } else if (e.key === 'Escape') { e.target.value = ''; runSearch(''); e.target.blur(); }
});

// ---------- 开关 / 导出 ----------
function toggle(key, value) {
  state[key] = value ?? !state[key];
  const btn = { agents: 'tAgents', tools: 'tTools', think: 'tThink', lines: 'tLines' }[key];
  $(btn).setAttribute('aria-pressed', String(state[key]));
  if (key === 'agents') { if (!state.agents) state.openAgents.clear(); relayout(state.sel); }
  if (key === 'lines') $('lines').hidden = !state.lines;
  if ((key === 'tools' || key === 'think') && state.sel) openDrawer(byId.get(state.sel));
}
$('tAgents').onclick = () => toggle('agents');
$('tTools').onclick = () => toggle('tools');
$('tThink').onclick = () => toggle('think');
$('tLines').onclick = () => toggle('lines');

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const baseName = `${DATA.project.name}-context-tree`;
function doExport(kind) {
  const mdOpts = { tools: state.tools, thinking: state.think };
  if (kind === 'json') { hydrate(); download(`${baseName}.json`, JSON.stringify(DATA, null, 2), 'application/json'); }
  else if (kind === 'md-all') download(`${baseName}.md`, toMarkdown(DATA, mdOpts), 'text/markdown');
  else if (kind === 'md-path') {
    if (!state.sel) { alert('先在树上点选一条回复，再导出它的上下文链。'); return; }
    download(`${baseName}-chain-${idxOf.get(state.sel)}.md`, toMarkdown(DATA, { ...mdOpts, turnIds: contextChain(state.sel), title: `上下文链 · ${DATA.project.name}` }), 'text/markdown');
  }
}
const menu = $('exportMenu');
$('exportBtn').onclick = (e) => { e.stopPropagation(); const open = menu.classList.toggle('open'); $('exportBtn').setAttribute('aria-expanded', String(open)); };
document.addEventListener('click', () => { menu.classList.remove('open'); $('exportBtn').setAttribute('aria-expanded', 'false'); });
menu.querySelectorAll('[data-ex]').forEach((b) => b.addEventListener('click', () => doExport(b.dataset.ex)));
$('dPath').onclick = () => doExport('md-path');
$('dCopy').onclick = async () => {
  const text = toMarkdown(DATA, { turnIds: [state.sel], tools: state.tools, thinking: state.think, title: `${DATA.project.name} · 第 ${idxOf.get(state.sel)} 轮` });
  try { await navigator.clipboard.writeText(text); $('dCopy').textContent = '已复制'; }
  catch { download(`${baseName}-turn.md`, text, 'text/markdown'); $('dCopy').textContent = '已下载'; }
  setTimeout(() => { $('dCopy').textContent = '复制本轮 Markdown'; }, 1400);
};

// ---------- 键盘 ----------
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input')) return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (!state.sel) return;
  const t = byId.get(state.sel);
  const { prev, next } = laneNeighbors(t);
  if (e.key === 'ArrowRight' && next) { e.preventDefault(); select(next.id, true); }
  else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (prev) select(prev.id, true);
    else { const up = layout.parentOf.get(t.id); if (up && up !== 'ROOT') select(up, true); }
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const p = layout.pos.get(t.id);
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    let best = null;
    for (const [id, q] of layout.pos) {
      if ((q.row - p.row) * dir <= 0) continue;
      const score = Math.abs(q.row - p.row) * 1000 + Math.abs(q.col - p.col);
      if (!best || score < best.score) best = { id, score };
    }
    if (best) select(best.id, true);
  }
});

// ---------- 线路列表 ----------
function renderLines() {
  const nav = $('lines');
  const sessions = DATA.lanes.filter((l) => l.kind === 'session');
  nav.innerHTML = `<div class="lh">线路<b>${sessions.length}</b></div>` + sessions.map((l) => {
    const agents = agentCount.get(l.sessionId) || 0;
    return `<button class="row" data-lane="${esc(l.key)}" style="--c:${l.color}"><span class="no">${esc(l.no)}</span>`
      + `<span class="t" title="${esc(l.title)}">${esc(l.title)}</span>`
      + `<span class="d">${fmtTime(l.start)}　${l.turnCount} 轮${agents ? `　${agents} 个子代理` : ''}</span></button>`;
  }).join('');
}
$('lines').addEventListener('click', (e) => {
  const b = e.target.closest('.row');
  if (b) select(laneTurns.get(b.dataset.lane)[0].id, true);
});

// ---------- 启动 ----------
$('pname').innerHTML = `${esc(DATA.project.name)}<small>上下文树</small>`;
document.title = `${DATA.project.name} · 上下文树`;
const s = DATA.stats;
const LOCK = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>';
$('stats').innerHTML = `<span><b>${s.sessions}</b>个会话</span><span><b>${s.turns}</b>轮对话</span>${s.agents ? `<span><b>${s.agents}</b>个子代理</span>` : ''}`
  + (s.redacted ? `<span class="safe" title="生成时按规则把密钥换成了占位，页面里只有「密钥已隐藏」标签">${LOCK}已隐藏<b>${s.redacted}</b>处密钥</span>` : '')
  + `<span class="range">${fmtTime(s.start)} 至 ${fmtTime(s.end)}</span>`;
if (!DATA.turns.length) {
  document.body.insertAdjacentHTML('beforeend', '<div class="empty"><div>这个项目下还没有可显示的对话。<br>先在该目录里和 Claude Code 聊几轮，再重新生成。</div></div>');
} else {
  buildLayout();
  // 先定好初始视角再渲染，首屏挂上的就是真正要显示的那批卡片
  view.k = 0.9;
  view.x = state.lines && innerWidth > 900 ? 300 : 10;
  view.y = 16;
  render();
  renderLines();
  paintView();
  idle(idleHaystack);
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && byId.has(hash)) select(hash, true);
}
function syncViewport() {
  const w = vp.clientWidth, h = vp.clientHeight;
  if (w === vpSize.w && h === vpSize.h) return;
  vpSize.w = w; vpSize.h = h;
  cardRangeKey = '';
  if (layout) paintView();
}
addEventListener('resize', syncViewport);
new ResizeObserver(syncViewport).observe(vp);
</script>
</body>
</html>
